<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northwind Tools — Admin</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/fixture-config.js"></script>
  </head>
  <body>
    <header>
      <strong>Northwind Tools</strong>
      <a href="/">Home</a>
      <a href="/pricing.html">Pricing</a>
      <a href="/admin/">Admin</a>
      <a href="/app/">Dashboard (SPA)</a>
    </header>
    <main>
      <h1>Admin area</h1>
      <p>
        The demo project excludes <code>/admin/*</code>, so no launcher should appear here and the
        server rejects reports that claim to come from this path.
      </p>
      <p class="status" id="widget-state">Loading…</p>
    </main>
    <script>
      window.BUGINBOX_FIXTURE.load();
      setInterval(function () {
        var state = window.BugInbox ? window.BugInbox.state() : null;
        document.getElementById('widget-state').textContent = state
          ? 'eligible=' + state.eligible + ' launcher=' + state.launcherVisible + ' — ' + state.reason
          : 'BugInbox is not loaded.';
      }, 300);
    </script>
  </body>
</html>
