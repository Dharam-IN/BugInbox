# Lint, typecheck, build and test. Runs on every push to main and every pull
# request. Nothing here deploys and nothing here touches a registry.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The integration suite talks to real datastores rather than mocks, so CI
    # runs the same three the development stack uses. Mailpit is here because
    # the notification tests assert on delivered mail and read it back.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: buginbox
          POSTGRES_PASSWORD: buginbox
          POSTGRES_DB: buginbox
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U buginbox -d buginbox"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.28
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports: ["58025:8025", "51025:1025"]

    env:
      # apps/server/src/tests/setup.ts reads these two and derives the rest.
      TEST_DATABASE_URL: postgres://buginbox:buginbox@127.0.0.1:55432/buginbox_test
      TEST_REDIS_URL: redis://127.0.0.1:56379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Mailpit
        # No --health-cmd for this one: the image is not guaranteed to have a
        # shell for Docker to run a health command through.
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:58025/api/v1/info >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Mailpit did not become ready"; exit 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test
