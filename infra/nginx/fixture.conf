# Integration fixture host website. Deliberately a different origin from the
# BugInbox API so cross-origin behaviour is exercised for real.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # A host site with its own restrictive CSP, matching the documented
    # integration instructions.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' http://localhost:58080; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://localhost:58080; frame-ancestors 'none'" always;

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
